<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Owner & Admin Sign In | Learn Me</title>
    <link rel="icon" href="assets/learnme-logo.png" type="image/png">
    <link rel="stylesheet" href="css/admin.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #090d16;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.08) 0%, transparent 40%);
        }
        .admin-login-card {
            width: 100%;
            max-width: 440px;
            background: #111827;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            box-sizing: border-box;
        }
        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }
        .brand-header img {
            height: 38px;
            margin-bottom: 16px;
        }
        .brand-header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0 0 6px;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }
        .brand-header p {
            font-size: 13.5px;
            color: #94a3b8;
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .input-wrap {
            position: relative;
        }
        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
        }
        .form-input {
            width: 100%;
            padding: 13px 16px 13px 44px;
            border-radius: 10px;
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            background: #2563eb;
            color: #ffffff;
            border: none;
            font-weight: 700;
            font-size: 14.5px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }
        .security-note {
            text-align: center;
            font-size: 12px;
            color: #64748b;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <div class="admin-login-card">
        <div class="brand-header">
            <img src="assets/learnme-logo.png" alt="Learn Me">
            <h1>Admin Control Portal</h1>
            <p>Authorized personnel only. Sessions are audited.</p>
        </div>

        <div id="login-alert" class="alert-error"></div>

        <form id="admin-login-form">
            <div class="form-group">
                <label for="admin-email">Admin Email</label>
                <div class="input-wrap">
                    <i class="fas fa-user-shield"></i>
                    <input type="email" id="admin-email" class="form-input" placeholder="admin@learnme.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="admin-password">Password</label>
                <div class="input-wrap">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="admin-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> <span>Authenticate</span>
            </button>
        </form>

        <div class="security-note">
            <i class="fas fa-shield-halved"></i> Protected by Learn Me Central Cloud RBAC
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('submit-btn');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            try {
                const res = await AdminAPI.post('/auth/login', { email, password });
                const token = res.token || res.data?.token;
                const user = res.user || res.data?.user;

                if (!token || !user) {
                    throw new Error(res.message || 'Authentication failed.');
                }

                if (user.role !== 'admin') {
                    throw new Error('Access Denied: Your account does not have administrator privileges.');
                }

                AdminAPI.setToken(token);
                AdminAPI.setAdminUser(user);
                window.location.href = 'dashboard.html';
            } catch (err) {
                alertBox.textContent = err.message || 'Authentication error. Please check your credentials.';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Authenticate</span>';
            }
        });
    </script>
</body>
</html>
