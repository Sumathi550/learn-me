<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Learn Me - Database Viewer</title>
    <link rel="icon" href="assets/learnme-logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/learnme-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --font: 'Plus Jakarta Sans', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font);
            min-height: 100vh;
            padding: 24px;
        }

        .header {
            max-width: 1400px;
            margin: 0 auto 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--bg-card);
            padding: 20px 28px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .header-title h1 {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title h1 i { color: var(--primary); }
        .header-title p { color: var(--text-muted); font-size: 13px; margin-top: 4px; }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .btn {
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-primary:hover { background: var(--primary-hover); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background: var(--bg-input); }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .stats-grid {
            max-width: 1400px;
            margin: 0 auto 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 18px 22px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .stat-icon.users { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .stat-icon.courses { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
        .stat-icon.enrollments { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
        .stat-icon.certs { background: rgba(16, 185, 129, 0.15); color: #34d399; }

        .stat-info .num { font-size: 24px; font-weight: 800; }
        .stat-info .label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

        .main-card {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .tabs-bar {
            display: flex;
            align-items: center;
            background: #151f32;
            border-bottom: 1px solid var(--border);
            padding: 8px 16px;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .tab-btn:hover { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
        .tab-btn.active { background: var(--bg-card); color: var(--primary); border: 1px solid var(--border); }
        .tab-btn .badge-count {
            background: rgba(255,255,255,0.1);
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 11px;
        }

        .toolbar {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.4);
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 360px;
        }
        .search-box input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            padding: 9px 14px 9px 36px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .table-wrap {
            overflow-x: auto;
            max-height: 600px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }

        th {
            background: #172337;
            padding: 12px 18px;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(51, 65, 85, 0.5);
            color: var(--text-main);
        }

        tr:hover td { background: rgba(56, 189, 248, 0.04); }

        .id-pill {
            font-family: var(--mono);
            font-size: 11px;
            background: rgba(255,255,255,0.06);
            padding: 3px 7px;
            border-radius: 6px;
            color: #cbd5e1;
        }

        .tag-pill {
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }
        .tag-admin { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .tag-user { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .tag-valid { background: rgba(16, 185, 129, 0.15); color: #34d399; }
        .tag-active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }

        .empty-state {
            padding: 48px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 36px; margin-bottom: 12px; opacity: 0.5; }

        @media (max-width: 991px) {
            body { padding: 16px; }
            .header { padding: 16px 20px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            body { padding: 12px; }
            .header { flex-direction: column; align-items: stretch; padding: 16px; gap: 14px; }
            .header-title h1 { font-size: 19px; }
            .header-actions { justify-content: space-between; flex-wrap: wrap; gap: 8px; }
            .header-actions .btn { flex: 1 1 calc(50% - 8px); justify-content: center; }
            .stats-grid { grid-template-columns: 1fr; gap: 10px; }
            .toolbar { flex-direction: column; align-items: stretch; padding: 14px 16px; gap: 10px; }
            .search-box { max-width: 100%; width: 100%; }
            .tab-btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="header-title">
            <h1><i class="fas fa-database"></i> Learn Me Database Viewer</h1>
            <p id="db-location-text">Active Storage: SQLite (backend/data/learnme.sqlite)</p>
        </div>
        <div class="header-actions">
            <span class="badge-status" id="db-status-badge"><i class="fas fa-circle-check"></i> Connected</span>
            <button class="btn btn-outline" onclick="loadAllData()"><i class="fas fa-rotate"></i> Refresh</button>
            <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Site</a>
        </div>
    </div>

    <!-- Quick Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon users"><i class="fas fa-users"></i></div>
            <div class="stat-info">
                <div class="num" id="stat-users">0</div>
                <div class="label">Total Users</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon courses"><i class="fas fa-graduation-cap"></i></div>
            <div class="stat-info">
                <div class="num" id="stat-courses">0</div>
                <div class="label">Active Courses</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon enrollments"><i class="fas fa-laptop-code"></i></div>
            <div class="stat-info">
                <div class="num" id="stat-enrollments">0</div>
                <div class="label">Enrollments</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon certs"><i class="fas fa-award"></i></div>
            <div class="stat-info">
                <div class="num" id="stat-certs">0</div>
                <div class="label">Certificates</div>
            </div>
        </div>
    </div>

    <!-- Main Explorer Card -->
    <div class="main-card">
        <!-- Tabs -->
        <div class="tabs-bar">
            <button class="tab-btn active" onclick="switchTab('users')">
                <i class="fas fa-users"></i> Users <span class="badge-count" id="tab-count-users">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('courses')">
                <i class="fas fa-book"></i> Courses <span class="badge-count" id="tab-count-courses">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('enrollments')">
                <i class="fas fa-id-badge"></i> Enrollments <span class="badge-count" id="tab-count-enrollments">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('certificates')">
                <i class="fas fa-certificate"></i> Certificates <span class="badge-count" id="tab-count-certificates">0</span>
            </button>
            <button class="tab-btn" onclick="switchTab('activities')">
                <i class="fas fa-clock-rotate-left"></i> Activity Logs <span class="badge-count" id="tab-count-activities">0</span>
            </button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Search current table..." oninput="handleSearch(this.value)">
            </div>
            <div style="font-size: 12px; color: var(--text-muted);" id="row-count-text">Showing all records</div>
        </div>

        <!-- Table View -->
        <div class="table-wrap">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let dbState = {
            activeTab: 'users',
            data: { users: [], courses: [], enrollments: [], certificates: [], activities: [] },
            filteredData: []
        };

        const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        const API_ORIGIN = window.location.protocol === 'file:' || (isLocalhost && window.location.port !== '5000')
            ? 'http://localhost:5000'
            : window.location.origin;

        async function loadAllData() {
            try {
                const token = localStorage.getItem('learnMeAuthToken') || localStorage.getItem('adminToken');
                const headers = { 'Content-Type': 'application/json' };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                const res = await fetch(`${API_ORIGIN}/api/db-explorer`, { headers });
                if (res.status === 401 || res.status === 403) {
                    document.getElementById('db-status-badge').innerHTML = '<i class="fas fa-lock"></i> Access Restricted';
                    document.getElementById('db-status-badge').style.color = '#f59e0b';
                    document.getElementById('table-body').innerHTML = `
                        <tr>
                            <td colspan="8" style="text-align: center; padding: 48px 20px;">
                                <div style="font-size: 36px; color: #f59e0b; margin-bottom: 12px;"><i class="fas fa-shield-halved"></i></div>
                                <h3 style="font-size: 18px; color: var(--text-main); margin-bottom: 8px;">Owner Admin Authorization Required</h3>
                                <p style="font-size: 14px; color: var(--text-muted); max-width: 480px; margin: 0 auto 18px;">
                                    The Live Database Explorer is protected to secure user privacy. Please sign into the Owner Admin Panel (sumathiaz550@gmail.com) to access system records.
                                </p>
                                <a href="admin.html" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none; padding: 10px 20px; border-radius: 10px;">
                                    <i class="fas fa-sign-in-alt"></i> Go to Admin Panel
                                </a>
                            </td>
                        </tr>
                    `;
                    return;
                }
                if (!res.ok) throw new Error('API error: ' + res.status);
                const data = await res.json();
                
                dbState.data = data;
                
                // Update stats
                document.getElementById('stat-users').textContent = (data.users || []).length;
                document.getElementById('stat-courses').textContent = (data.courses || []).length;
                document.getElementById('stat-enrollments').textContent = (data.enrollments || []).length;
                document.getElementById('stat-certs').textContent = (data.certificates || []).length;

                document.getElementById('tab-count-users').textContent = (data.users || []).length;
                document.getElementById('tab-count-courses').textContent = (data.courses || []).length;
                document.getElementById('tab-count-enrollments').textContent = (data.enrollments || []).length;
                document.getElementById('tab-count-certificates').textContent = (data.certificates || []).length;
                document.getElementById('tab-count-activities').textContent = (data.activities || []).length;

                if (data.dialect) {
                    document.getElementById('db-location-text').textContent = 
                        `Active Storage: ${data.dialect.toUpperCase()} (${data.storage || 'Connected'})`;
                }

                renderActiveTab();
            } catch (err) {
                console.error('Failed to load database explorer data:', err);
                document.getElementById('db-status-badge').innerHTML = '<i class="fas fa-triangle-exclamation"></i> Error';
                document.getElementById('db-status-badge').style.color = '#ef4444';
            }
        }

        function switchTab(tabName) {
            dbState.activeTab = tabName;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById('search-input').value = '';
            renderActiveTab();
        }

        function renderActiveTab() {
            const list = dbState.data[dbState.activeTab] || [];
            dbState.filteredData = list;
            renderTable(list);
        }

        function handleSearch(query) {
            const q = (query || '').toLowerCase().trim();
            const list = dbState.data[dbState.activeTab] || [];
            if (!q) {
                dbState.filteredData = list;
            } else {
                dbState.filteredData = list.filter(item => {
                    return Object.values(item).some(val => String(val || '').toLowerCase().includes(q));
                });
            }
            renderTable(dbState.filteredData);
        }

        function renderTable(rows) {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const countText = document.getElementById('row-count-text');

            countText.textContent = `Showing ${rows.length} records`;

            if (rows.length === 0) {
                thead.innerHTML = '';
                tbody.innerHTML = `<tr><td colspan="6" class="empty-state"><i class="fas fa-folder-open"></i><p>No records found in this table.</p></td></tr>`;
                return;
            }

            if (dbState.activeTab === 'users') {
                thead.innerHTML = `<tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Joined</th></tr>`;
                tbody.innerHTML = rows.map(u => `
                    <tr>
                        <td><span class="id-pill">${u.id || u._id}</span></td>
                        <td><strong>${u.name}</strong></td>
                        <td>${u.email}</td>
                        <td><span class="tag-pill ${u.role === 'admin' ? 'tag-admin' : 'tag-user'}">${(u.role || 'user').toUpperCase()}</span></td>
                        <td>${u.isActive ? '<span style="color:#10b981;">Active</span>' : '<span style="color:#ef4444;">Inactive</span>'}</td>
                        <td>${new Date(u.createdAt).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } else if (dbState.activeTab === 'courses') {
                thead.innerHTML = `<tr><th>Course ID</th><th>Title</th><th>Category</th><th>Difficulty</th><th>Price</th><th>Status</th></tr>`;
                tbody.innerHTML = rows.map(c => `
                    <tr>
                        <td><span class="id-pill">${c.courseId}</span></td>
                        <td><strong>${c.title}</strong></td>
                        <td>${c.category || 'General'}</td>
                        <td>${c.difficulty || 'Beginner'}</td>
                        <td>₹${c.certificatePrice || 10}</td>
                        <td><span class="tag-pill tag-valid">${(c.status || 'published').toUpperCase()}</span></td>
                    </tr>
                `).join('');
            } else if (dbState.activeTab === 'enrollments') {
                thead.innerHTML = `<tr><th>Enrollment ID</th><th>User ID</th><th>Course ID</th><th>Status</th><th>Date</th></tr>`;
                tbody.innerHTML = rows.map(e => `
                    <tr>
                        <td><span class="id-pill">${e.id}</span></td>
                        <td><span class="id-pill">${e.userId}</span></td>
                        <td><strong>${e.courseId.toUpperCase()}</strong></td>
                        <td><span class="tag-pill tag-active">${(e.status || 'active').toUpperCase()}</span></td>
                        <td>${new Date(e.enrolledAt || e.createdAt).toLocaleDateString()}</td>
                    </tr>
                `).join('');
            } else if (dbState.activeTab === 'certificates') {
                thead.innerHTML = `<tr><th>Certificate ID</th><th>Student Name</th><th>Course</th><th>Score</th><th>Status</th><th>Link</th></tr>`;
                tbody.innerHTML = rows.map(c => `
                    <tr>
                        <td><span class="id-pill" style="color:#38bdf8; font-weight:700;">${c.certificateId}</span></td>
                        <td><strong>${c.userName}</strong></td>
                        <td>${c.courseName}</td>
                        <td><span style="color:#10b981; font-weight:800;">${c.score}%</span></td>
                        <td><span class="tag-pill tag-valid">${(c.status || 'valid').toUpperCase()}</span></td>
                        <td><a href="verify.html?certificate=${encodeURIComponent(c.certificateId)}" target="_blank" style="color:#38bdf8; text-decoration:none; font-size:12px;"><i class="fas fa-external-link-alt"></i> Verify</a></td>
                    </tr>
                `).join('');
            } else if (dbState.activeTab === 'activities') {
                thead.innerHTML = `<tr><th>Action</th><th>Details</th><th>Timestamp</th></tr>`;
                tbody.innerHTML = rows.map(a => `
                    <tr>
                        <td><span class="tag-pill tag-user">${a.action}</span></td>
                        <td>${a.details}</td>
                        <td style="color:#94a3b8;">${new Date(a.createdAt).toLocaleString()}</td>
                    </tr>
                `).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', loadAllData);
    </script>
</body>
</html>
