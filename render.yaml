# ==============================================================================
# Learn Me - Render Cloud Infrastructure Blueprint
# Auto-provisions Node.js Web Service + Free Cloud PostgreSQL Database
# ==============================================================================
version: "1"

services:
  - type: web
    name: learn-me-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm --prefix backend install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_DIALECT
        value: postgres
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ADMIN_EMAIL
        value: sumathiaz550@gmail.com
      - key: ADMIN_INITIAL_PASSWORD
        value: Sumathi@12345
      - key: DATABASE_URL
        fromDatabase:
          name: learnme-cloud-db
          property: connectionString

databases:
  - name: learnme-cloud-db
    plan: free
    region: oregon
    databaseName: learnme
    user: learnme_user
